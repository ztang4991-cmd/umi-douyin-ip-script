<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mamba Banquet System v0.1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="loginView" class="auth">
      <section class="auth-panel">
        <h1>Mamba Banquet</h1>
        <p>婚宴门店核心作战链 v0.1</p>
        <form id="loginForm" class="stack">
          <input name="email" type="email" placeholder="邮箱" value="owner@mamba.local" required />
          <input name="password" type="password" placeholder="密码" value="owner123" required />
          <button type="submit">登录工作台</button>
        </form>
        <details>
          <summary>从 0 创建门店和老板账号</summary>
          <form id="bootstrapForm" class="stack">
            <input name="tenant_name" placeholder="门店名称" required />
            <input name="name" placeholder="老板姓名" required />
            <input name="email" type="email" placeholder="邮箱" required />
            <input name="password" type="password" placeholder="至少 6 位密码" required />
            <button type="submit">创建门店</button>
          </form>
        </details>
      </section>
    </div>

    <div id="appView" class="app hidden">
      <aside class="sidebar">
        <div>
          <h2>Mamba</h2>
          <p id="tenantName"></p>
        </div>
        <nav>
          <button data-view="dashboard" class="active">老板看板</button>
          <button data-view="leads">客资 CRM</button>
          <button data-view="opportunities">商机</button>
          <button data-view="schedule">档期</button>
          <button data-view="orders">订单合同</button>
        </nav>
        <button id="logoutBtn" class="ghost">退出</button>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <h1 id="viewTitle">老板看板</h1>
            <p id="userInfo"></p>
          </div>
          <button id="refreshBtn">刷新数据</button>
        </header>

        <section id="dashboard" class="view"></section>
        <section id="leads" class="view hidden"></section>
        <section id="opportunities" class="view hidden"></section>
        <section id="schedule" class="view hidden"></section>
        <section id="orders" class="view hidden"></section>
      </main>
    </div>

    <dialog id="modal">
      <form method="dialog">
        <button class="modal-close">关闭</button>
      </form>
      <div id="modalBody"></div>
    </dialog>

    <div id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
